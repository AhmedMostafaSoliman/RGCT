program: rgct_main.py
method: grid
metric:
  name: avg_accuracy_pct
  goal: maximize
entity: leathead_AQ_AM_IO
project: RGCT

parameters:
  # ---- swept axes ----------------------------------------------------------
  dataset:
    values:
      - Meta-CIFAR10
      - Meta-CIFAR100
      - Meta-MNIST
      - Meta-TrafficSign
      - Meta-Omniglot
      - Meta-MSCOCO
  # ---- episode protocol ----------------------------------------------------
  # n_way and n_shot omitted: Meta-Dataset runs ignore them and use the
  # protocol selected by md_test_type below.
  backbone:
    value: vits16
  n_query:
    value: 10
  n_test_tasks:
    value: 1000
  n_workers:
    value: 8
  use_specific_trans:
    value: "true"

  # ---- locked RGCT-Dual v9 sharp hparams -----------------------------------
  reg_eps:
    value: 0.02
  reg_mass:
    value: 0.3
  sinkhorn_iters:
    value: 200
  use_ctb:
    value: "true"
  n_support_atoms:
    value: 64
  bary_iters:
    value: 5
  bary_inner_max:
    value: 30
  support_mix:
    value: 0.5
  support_trim_ratio:
    value: 0.95
  support_gate_temp:
    value: 0.5
  support_num_iter:
    value: 120
  alpha_global:
    value: 0.4
  calibrate:
    value: "true"
  episodic_trans_mode:
    value: support
  lambda_tv:
    value: 0.1
  lambda_clutter:
    value: 0.5
  rgct_outer_iters:
    value: 5
  tau_z:
    value: 0.1
  z_pdhg_iters:
    value: 50
  use_clutter:
    value: "true"
  anisotropic_tv:
    value: "true"
  rgct_scoring:
    value: primal
  max_patches:
    value: 0
  query_chunk_size:
    value: 32

  # ---- wandb ---------------------------------------------------------------
  use_wandb:
    value: "true"
  wandb_project:
    value: RGCT
  wandb_entity:
    value: leathead_AQ_AM_IO

  # ---- Meta-Dataset protocol ----------------------------------------------
  # meta_dataset_root and meta_records_root are NOT set here; each collaborator
  # configures them in their local rgct_main.py defaults or via $META_DATASET_ROOT
  # / $RECORDS env vars.
  md_test_type:
    value: 5shot

  note:
    value: fixed_hparam_meta_dataset_5shot

command:
  - /home/ahmedm04/projects/DINOSEG/.venv/bin/python
  - ${program}
  - ${args}
